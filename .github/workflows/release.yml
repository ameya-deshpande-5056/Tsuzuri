name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || inputs.tag }}
          releaseName: 'Tsuzuri ${{ github.ref_name || inputs.tag }}'
          releaseBody: 'See changelog and release notes.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  release-android:
    name: Build Android APK
    needs: release-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;28.2.13676358" "build-tools;36.0.0" "platforms;android-37"

      - name: Install Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android Target
        run: npx tauri android init --ci --skip-targets-install

      - name: Build Android Universal APK (arm64-v8a, armeabi-v7a, x86, x86_64)
        run: npx tauri android build --apk --target aarch64 armv7 i686 x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358

      - name: Sign Android APK
        run: |
          APK_RAW=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            echo "Error: No APK found to sign!"
            exit 1
          fi
          
          echo "Found APK: $APK_RAW"
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -name "apksigner" | head -n 1 | xargs dirname)
          echo "Using build-tools at: $BUILD_TOOLS"
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Signing with repository secret keystore..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            KEYSTORE="release.keystore"
            PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            echo "No keystore secret detected. Creating self-signed release key..."
            keytool -genkey -v -keystore release.keystore -alias tsuzuri -keyalg RSA -keysize 2048 -validity 10000 -storepass tsuzuripass -keypass tsuzuripass -dname "CN=Tsuzuri, O=Tsuzuri, C=US"
            KEYSTORE="release.keystore"
            PASS="tsuzuripass"
            ALIAS="tsuzuri"
          fi

          "$BUILD_TOOLS/zipalign" -f -v -p 4 "$APK_RAW" app-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$PASS" --out app-signed.apk app-aligned.apk
          "$BUILD_TOOLS/apksigner" verify app-signed.apk
          cp app-signed.apk "$APK_RAW"

      - name: Copy & Rename APK with Release Version
        run: |
          RAW_TAG="${{ github.ref_name || inputs.tag }}"
          VERSION="${RAW_TAG#v}"
          mkdir -p release-artifacts
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1 | while read -r apk; do
            cp "$apk" "release-artifacts/tsuzuri_${VERSION}.apk"
          done

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: release-artifacts/*.apk

  release-ios:
    name: Build iOS IPA
    needs: release-desktop
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting Xcode: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
          else
            echo "No Xcode 16 found under /Applications/Xcode_16*.app, keeping default"
          fi
          xcodebuild -version

      - name: Install Rust & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize iOS Target
        run: npx tauri ios init --ci --skip-targets-install

      - name: Build iOS Application Payload & IPA
        run: |
          RAW_TAG="${{ github.ref_name || inputs.tag }}"
          VERSION="${RAW_TAG#v}"
          npx tauri ios build --debug
          mkdir -p release-artifacts/Payload
          
          APP_DIR=$(find src-tauri/gen/apple/build -name "*.app" 2>/dev/null | head -n 1)
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            cp -r "$APP_DIR" release-artifacts/Payload/
            cd release-artifacts
            zip -r "tsuzuri_${VERSION}.ipa" Payload
          else
            echo "Warning: .app directory not found in build outputs"
          fi

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          files: release-artifacts/*.ipa

