name: Build Mobile (Android APK & iOS IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK & Build Tools
        run: |
          echo y | sdkmanager --licenses || true
          sdkmanager --install "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android Target (if needed)
        run: npx tauri android init --ci --skip-targets-install

      - name: Build Android Universal APK (arm64-v8a, armeabi-v7a, x86, x86_64)
        run: npx tauri android build --apk --debug --target aarch64 armv7 i686 x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: tsuzuri-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting Xcode: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV
          else
            echo "No Xcode 16 found under /Applications/Xcode_16*.app, keeping default"
          fi
          xcodebuild -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Initialize iOS Target
        run: npx tauri ios init --ci --skip-targets-install

      - name: Configure Unsigned iOS Build
        run: |
          cat << 'EOF' > ci.xcconfig
          CODE_SIGN_IDENTITY = 
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = 
          PROVISIONING_PROFILE_SPECIFIER = 
          EOF
          echo "XCODE_XCCONFIG_FILE=$PWD/ci.xcconfig" >> $GITHUB_ENV

          python3 -c "
          import os, re
          pbx = 'src-tauri/gen/apple/tsuzuri.xcodeproj/project.pbxproj'
          if os.path.exists(pbx):
              with open(pbx, 'r') as f:
                  content = f.read()
              content = content.replace('ProvisioningStyle = Automatic;', 'ProvisioningStyle = Manual;')
              content = content.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
              content = re.sub(
                  r'(buildSettings\s*=\s*\{)',
                  r'\1\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";\n\t\t\t\tCODE_SIGN_STYLE = Manual;',
                  content
              )
              with open(pbx, 'w') as f:
                  f.write(content)
              print('Successfully patched project.pbxproj for unsigned build')
          else:
              print('Warning: project.pbxproj not found at', pbx)
          "

      - name: Build iOS Application
        run: |
          # Build frontend assets first
          npm run build

          # Build iOS application with xcodebuild without code signing
          npx tauri ios build --debug || xcodebuild \
            -scheme tsuzuri_iOS \
            -workspace src-tauri/gen/apple/tsuzuri.xcodeproj/project.xcworkspace/ \
            -sdk iphoneos \
            -configuration debug \
            -derivedDataPath src-tauri/gen/apple/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build
          
          # Package Payload into unsigned IPA for ad-hoc / AltStore / Sideloadly testing
          APP_DIR=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | grep "Debug-iphoneos" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            APP_DIR=$(find src-tauri/gen/apple ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | head -n 1)
          fi

          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            echo "Found .app at: $APP_DIR"
            mkdir -p Payload
            cp -r "$APP_DIR" Payload/
            zip -r tsuzuri-unsigned.ipa Payload/
          else
            echo "Warning: .app directory not found in build outputs"
          fi

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsuzuri-ios-payload
          path: |
            tsuzuri-unsigned.ipa
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn

