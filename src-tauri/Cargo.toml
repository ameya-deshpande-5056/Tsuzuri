[package]
name = "tsuzuri"
version = "1.0.0"
description = "A lightweight, offline, cross-platform Markdown document reader and editor"
authors = ["Ameya Deshpande"]
license = "GPL-3.0"
repository = "https://github.com/ameya-deshpande-5056/tsuzuri"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tsuzuri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
base64 = "0.22"

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd")))'.dependencies]
tauri-plugin-dialog = "2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.dev]
debug = 1

# Strip debug symbols from 3rd-party dependencies to keep target directory compact
[profile.dev.package."*"]
debug = 0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
num_threads = { path = "patches/num_threads" }
