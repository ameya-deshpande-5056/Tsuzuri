[package]
name = "tsuzuri"
version = "1.0.0"
description = "A lightweight, offline, cross-platform Markdown document reader and editor"
authors = ["Ameya Deshpande"]
license = "GPL-3.0"
repository = "https://github.com/ameya-deshpande-5056/tsuzuri"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tsuzuri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
