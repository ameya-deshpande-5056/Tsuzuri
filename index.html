<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <style>
      /* Immediate synchronous pre-paint background to eliminate startup theme flash */
      html[data-theme="dark"],
      html.dark {
        background-color: #000000;
        color: #f4f4f5;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background-color: #000000;
          color: #f4f4f5;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("tsuzuri_theme") || "system";
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = saved === "dark" || (saved === "system" && prefersDark);
          var root = document.documentElement;
          root.setAttribute("data-theme", isDark ? "dark" : "light");
          root.setAttribute("data-theme-mode", saved);
          if (isDark) {
            root.classList.add("dark");
          } else {
            root.classList.remove("dark");
          }
          var meta = document.getElementById("theme-color-meta");
          if (meta) {
            meta.setAttribute("content", isDark ? "#000000" : "#ffffff");
          }
          var savedZoom = localStorage.getItem("tsuzuri_zoom");
          if (savedZoom) {
            var z = parseFloat(savedZoom);
            if (!isNaN(z) && z >= 0.5 && z <= 3.0) {
              root.style.setProperty("--app-zoom", String(z));
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tsuzuri</title>
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Minimalist App Chrome -->
      <header class="app-header" id="app-header">
        <div class="header-left">
          <span class="app-name" title="About Tsuzuri" role="button" tabindex="0">綴り</span>
          <span class="doc-title-wrapper">
            <span id="doc-title" class="doc-title">untitled.md</span>
            <span id="dirty-indicator" class="dirty-indicator" title="Unsaved changes" style="display: none;">•</span>
          </span>
        </div>

        <div class="header-right">
          <button id="btn-toc" class="tool-btn" title="Table of Contents" aria-label="Table of Contents">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="12" x2="14" y2="12"></line>
              <line x1="4" y1="18" x2="18" y2="18"></line>
            </svg>
          </button>

          <button id="btn-save" class="tool-btn" title="Save Document (Ctrl+S)" aria-label="Save Document">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
          </button>

          <button id="btn-more" class="tool-btn" title="More Actions" aria-label="More Actions">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="2"></circle>
              <circle cx="19" cy="12" r="2"></circle>
              <circle cx="5" cy="12" r="2"></circle>
            </svg>
          </button>
        </div>
      </header>

      <!-- Primary Content Area -->
      <main class="app-content">
        <!-- 1. Reader View (Typeset Document, Mutually Exclusive) -->
        <section id="reader-view" class="view-pane reader-pane active" aria-label="Rendered Document" tabindex="0">
          <article id="reader-content" class="reader-content"></article>
        </section>

        <!-- 2. Editor View (Raw Markdown, Mutually Exclusive) -->
        <section id="editor-view" class="view-pane editor-pane" aria-label="Markdown Editor" style="display: none;">
          <!-- Inline Find & Replace Toolbar -->
          <div id="find-replace-bar" class="find-replace-bar" style="display: none;">
            <div class="find-row">
              <div class="input-with-count">
                <input type="text" id="find-input" placeholder="Find..." spellcheck="false" autocomplete="off" />
                <span id="find-count" class="find-count">0/0</span>
              </div>
              <button id="btn-find-prev" class="find-btn" title="Previous match (Shift+Enter)">▲</button>
              <button id="btn-find-next" class="find-btn" title="Next match (Enter)">▼</button>
              <button id="btn-close-find" class="find-btn close-btn" title="Close (Escape)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
            <div class="replace-row" id="replace-row">
              <input type="text" id="replace-input" placeholder="Replace with..." spellcheck="false" autocomplete="off" />
              <button id="btn-replace-one" class="find-btn text-btn">Replace</button>
              <button id="btn-replace-all" class="find-btn text-btn">All</button>
            </div>
          </div>

          <!-- Editor Surface -->
          <div class="editor-surface">
            <pre id="line-gutter" class="line-gutter" aria-hidden="true">1</pre>
            <textarea
              id="markdown-textarea"
              class="markdown-textarea"
              wrap="off"
              placeholder="Start typing Markdown here..."
              spellcheck="false"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
            ></textarea>
          </div>

          <!-- Subtle Editor Statusbar -->
          <footer class="editor-statusbar">
            <div class="status-left">
              <span id="editor-cursor-pos">Ln 1, Col 1</span>
              <button id="btn-toggle-wrap" class="status-btn" title="Toggle Word Wrap (Alt+Z)" aria-label="Toggle Word Wrap">Wrap: On</button>
            </div>
            <div class="status-right">
              <span id="editor-stats">0 words · 0 chars</span>
            </div>
          </footer>
        </section>

        <!-- Temporary Table of Contents Drawer -->
        <aside id="toc-drawer" class="toc-drawer" aria-label="Table of Contents" aria-hidden="true">
          <div class="toc-header">
            <h3 class="toc-heading">Contents</h3>
            <button id="btn-close-toc" class="tool-btn close-toc-btn" aria-label="Close Table of Contents">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <nav id="toc-list" class="toc-list"></nav>
        </aside>
      </main>

      <!-- Backdrop for Drawers & Bottom Sheets -->
      <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>

      <!-- Mobile Actions Bottom Sheet -->
      <aside id="mobile-sheet" class="mobile-sheet" aria-label="Document Actions" aria-hidden="true">
        <div class="sheet-handle-bar">
          <div class="sheet-handle"></div>
        </div>
        <div class="sheet-header">
          <span class="sheet-title">Actions</span>
          <button id="btn-close-sheet" class="tool-btn close-btn" aria-label="Close Actions">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="sheet-body">
          <div class="sheet-actions">
            <button id="sheet-btn-view-mode" class="sheet-action-item" title="Switch to Editor Mode (Ctrl+E)">
              <svg id="sheet-view-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
                <path d="m15 5 4 4"></path>
              </svg>
              <span id="sheet-view-label">Edit Document</span>
              <kbd class="menu-shortcut-badge">Ctrl+E</kbd>
            </button>
            <button id="sheet-btn-open" class="sheet-action-item" title="Open Document (Ctrl+O)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path>
              </svg>
              <span>Open Document...</span>
              <kbd class="menu-shortcut-badge">Ctrl+O</kbd>
            </button>
            <button id="sheet-btn-save" class="sheet-action-item" title="Save Document (Ctrl+S)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              <span>Save Document</span>
              <kbd class="menu-shortcut-badge">Ctrl+S</kbd>
            </button>
            <button id="sheet-btn-find" class="sheet-action-item" title="Find & Replace (Ctrl+F)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <span>Find &amp; Replace</span>
              <kbd class="menu-shortcut-badge">Ctrl+F</kbd>
            </button>
            <button id="sheet-btn-wrap" class="sheet-action-item" title="Toggle Word Wrap (Alt+Z)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 10 4 15 9 20"></polyline>
                <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
              </svg>
              <span id="sheet-wrap-label">Word Wrap: On</span>
              <kbd class="menu-shortcut-badge">Alt+Z</kbd>
            </button>
            <button id="sheet-btn-about" class="sheet-action-item" title="About Tsuzuri">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="16" x2="12" y2="12"></line>
                <line x1="12" y1="8" x2="12.01" y2="8"></line>
              </svg>
              <span>About Tsuzuri</span>
            </button>
          </div>

          <div class="sheet-section-title">Zoom</div>
          <div class="menu-zoom-row">
            <button id="sheet-btn-zoom-out" class="menu-zoom-btn" title="Zoom Out (Ctrl+-)" aria-label="Zoom Out">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <input
              type="range"
              id="menu-zoom-slider"
              class="menu-zoom-slider"
              min="60"
              max="240"
              step="10"
              value="100"
              title="Zoom Level Slider"
              aria-label="Zoom Level Slider"
            />
            <button id="sheet-btn-zoom-in" class="menu-zoom-btn" title="Zoom In (Ctrl++)" aria-label="Zoom In">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
            <button id="sheet-btn-zoom-reset" class="menu-zoom-val-btn" title="Reset Zoom to 100% (Ctrl+0)" aria-label="Reset Zoom">
              <span id="sheet-zoom-value">100%</span>
            </button>
          </div>

          <div class="sheet-section-title">Theme</div>
          <div class="sheet-theme-switcher">
            <button class="sheet-theme-btn" data-theme-mode="system">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
              <span>System</span>
            </button>
            <button class="sheet-theme-btn" data-theme-mode="light">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
              </svg>
              <span>Light</span>
            </button>
            <button class="sheet-theme-btn" data-theme-mode="dark">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
              <span>AMOLED Dark</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- About Application Modal Dialog -->
      <div id="about-modal-backdrop" class="modal-backdrop" aria-hidden="true">
        <div id="about-dialog" class="about-dialog" role="dialog" aria-modal="true" aria-labelledby="about-dialog-title">
          <div class="about-header">
            <span id="about-dialog-title" class="about-title">About Tsuzuri</span>
            <button id="btn-close-about-x" class="about-close-x-btn" title="Close" aria-label="Close About Dialog">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
          <div class="about-body">
            <div class="about-icon-container">
              <img src="/icon.png" alt="Tsuzuri Icon" class="about-app-icon" />
            </div>
            <div class="about-details">
              <h2 id="about-version-heading" class="about-app-heading">Tsuzuri 1.0.11</h2>
              <p class="about-description">A quiet, lightweight, and offline Markdown document reader and editor.</p>
              <div class="about-meta-grid">
                <span class="about-meta-label">Version:</span>
                <span id="about-meta-version" class="about-meta-value">1.0.11</span>

                <span class="about-meta-label">Build time:</span>
                <span id="about-meta-build-time" class="about-meta-value"></span>

                <span class="about-meta-label">Project:</span>
                <span class="about-meta-value">
                  <a id="about-github-link" href="https://github.com/ameya-deshpande-5056/tsuzuri" target="_blank" rel="noopener noreferrer" class="about-link">https://github.com/ameya-deshpande-5056/tsuzuri</a>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Transient Status Message Toast -->
      <div id="toast-notification" class="toast-notification" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
